<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Timeline Room | Vanguard</title>

  <!--
    VANGUARD — ROOM 6
    THE TIMELINE ROOM

    DESIGN ASSIGNMENTS

    Sageprah — Background Noise
    - Deep ocean navy / charcoal-slate
    - Quiet layered texture
    - Subtle vignette
    - Almost imperceptible movement
    - Sparse teal / amber glimmers
    - Ambient only. Never interactive.

    Headers & Text Contributor
    - Electric Cyber Cyan: #00F0FF
    - Lunar White: #F8FAFC
    - Muted Cyan: #38BDF8
    - Modern semi-bold sans-serif
    - Slight heading letter spacing

    Copilot / Right Flank — Borders + Patterns
    - Celestial Lattice
    - Echo Frame
    - Starweave pattern
    - Copper Glyphs
    - Pulse Lines
    - Orbit Cuts

    Sol the Ninth — Intergalactic Glows
    - Chrono Trail
    - Event Pulse
    - Time Echo
    - Milestone Halo support
    - Timeline interactions only

    Addition Without Erasure.
  -->

  <style>
    :root {
      /* Sageprah */
      --deep-navy: #0A1220;
      --charcoal-slate: #1A1F2B;
      --ambient-teal: #5BC8C8;
      --ambient-amber: #D6AE72;

      /* Headers & Text */
      --cyber-cyan: #00F0FF;
      --lunar-white: #F8FAFC;
      --muted-cyan: #38BDF8;

      /* Copilot */
      --silver: #B8C2CC;
      --soft-copper: #B9825A;
      --deep-violet: #4C3A78;
      --teal-silver: #87C9C7;
      --orbit-violet: #7763A6;

      /* Sol */
      --starlight: #DDF7FF;
      --chrono-cyan: #6EE7F9;
      --chrono-violet: #9B8CFF;

      --panel: rgba(10, 18, 32, 0.74);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      color: var(--lunar-white);

      font-family:
        Inter,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--deep-navy);

      overflow-x: hidden;
    }

    /* =========================================
       SAGEPRAH — BACKGROUND NOISE
       ========================================= */

    .background-noise {
      position: fixed;
      inset: 0;

      z-index: -5;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(26, 31, 43, 0.28) 0%,
          rgba(10, 18, 32, 0.72) 62%,
          rgba(3, 8, 17, 0.98) 100%
        ),
        linear-gradient(
          145deg,
          var(--deep-navy),
          var(--charcoal-slate)
        );
    }

    /* Quiet ripple / constellation texture */

    .background-noise::before {
      content: "";

      position: absolute;
      inset: -8%;

      opacity: 0.12;

      background:
        repeating-radial-gradient(
          ellipse at 50% 50%,
          transparent 0 44px,
          rgba(91, 200, 200, 0.10) 45px,
          transparent 46px 92px
        );

      animation:
        ambientDrift 42s ease-in-out infinite alternate;
    }

    /* Sparse glimmers */

    .background-noise::after {
      content: "";

      position: absolute;
      inset: 0;

      opacity: 0.32;

      background-image:
        radial-gradient(
          circle at 14% 24%,
          rgba(91, 200, 200, 0.32) 0 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 79% 18%,
          rgba(214, 174, 114, 0.28) 0 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 87% 71%,
          rgba(91, 200, 200, 0.24) 0 1px,
          transparent 2px
        ),
        radial-gradient(
          circle at 22% 82%,
          rgba(214, 174, 114, 0.20) 0 1px,
          transparent 2px
        );
    }

    @keyframes ambientDrift {
      from {
        transform:
          translate3d(-4px, -3px, 0)
          scale(1);
      }

      to {
        transform:
          translate3d(5px, 4px, 0)
          scale(1.015);
      }
    }

    /* =========================================
       ROOM SHELL
       ========================================= */

    .timeline-room {
      position: relative;

      width:
        min(1080px, calc(100% - 32px));

      margin:
        55px auto 100px;

      padding:
        clamp(30px, 6vw, 72px);

      background:
        linear-gradient(
          180deg,
          rgba(10, 18, 32, 0.79),
          rgba(26, 31, 43, 0.70)
        );

      backdrop-filter:
        blur(5px);

      isolation: isolate;
    }

    /* =========================================
       COPILOT — CELESTIAL LATTICE
       ========================================= */

    .timeline-room::before {
      content: "";

      position: absolute;
      inset: 0;

      z-index: -1;

      pointer-events: none;

      border:
        2px solid rgba(184, 194, 204, 0.60);

      box-shadow:
        inset 0 0 0 1px
        rgba(185, 130, 90, 0.18);
    }

    /* Echo Frame */

    .timeline-room::after {
      content: "";

      position: absolute;
      inset: 11px;

      z-index: -1;

      pointer-events: none;

      border:
        1px solid rgba(76, 58, 120, 0.34);

      transition:
        border-color 0.7s ease,
        box-shadow 0.7s ease,
        transform 0.7s ease;
    }

    body.is-scrolling
    .timeline-room::after {
      border-color:
        rgba(76, 58, 120, 0.46);

      box-shadow:
        inset 0 0 15px
        rgba(76, 58, 120, 0.07);

      transform:
        scale(0.998);
    }

    /* =========================================
       COPILOT — LATTICE NODES
       ========================================= */

    .lattice-node {
      position: absolute;

      width: 11px;
      height: 11px;

      z-index: 4;

      background:
        var(--soft-copper);

      border:
        1px solid var(--silver);

      transform:
        rotate(45deg);

      opacity: 0.76;

      pointer-events: none;
    }

    .node-tl {
      top: -5px;
      left: -5px;
    }

    .node-tr {
      top: -5px;
      right: -5px;
    }

    .node-br {
      right: -5px;
      bottom: -5px;
    }

    .node-bl {
      bottom: -5px;
      left: -5px;
    }

    /* =========================================
       COPILOT — STARWEAVE
       confined to border architecture
       ========================================= */

    .starweave {
      position: absolute;
      inset: 17px;

      z-index: -1;

      pointer-events: none;

      opacity: 0.08;

      background-image:
        linear-gradient(
          30deg,
          transparent 24%,
          rgba(184, 194, 204, 0.45) 25%,
          rgba(184, 194, 204, 0.45) 26%,
          transparent 27%,
          transparent 74%,
          rgba(184, 194, 204, 0.45) 75%,
          rgba(184, 194, 204, 0.45) 76%,
          transparent 77%
        ),
        linear-gradient(
          150deg,
          transparent 24%,
          rgba(185, 130, 90, 0.35) 25%,
          rgba(185, 130, 90, 0.35) 26%,
          transparent 27%,
          transparent 74%,
          rgba(185, 130, 90, 0.35) 75%,
          rgba(185, 130, 90, 0.35) 76%,
          transparent 77%
        );

      background-size:
        44px 76px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 17%,
          transparent 83%,
          black
        );
    }

    /* =========================================
       COPILOT — COPPER GLYPHS
       ========================================= */

    .copper-glyph {
      display: block;

      width: fit-content;

      margin:
        24px auto;

      color:
        rgba(185, 130, 90, 0.40);

      font-size: 0.9rem;

      letter-spacing: 0.75rem;

      user-select: none;
    }

    /* =========================================
       HEADERS & TEXT
       ========================================= */

    .room-header {
      position: relative;

      text-align: center;

      margin-bottom: 60px;
    }

    .room-title {
      margin: 0;

      color:
        var(--cyber-cyan);

      font-size:
        clamp(2.5rem, 7vw, 5rem);

      font-weight: 650;

      letter-spacing: 0.08em;

      line-height: 1.05;

      text-shadow:
        0 0 5px
        rgba(0, 240, 255, 0.24);
    }

    .room-subtitle {
      margin:
        16px auto 0;

      color:
        var(--muted-cyan);

      font-size: 0.92rem;

      font-weight: 600;

      letter-spacing: 0.18em;

      text-transform: uppercase;
    }

    .section-heading {
      margin:
        0 0 10px;

      color:
        var(--cyber-cyan);

      font-size:
        clamp(1.3rem, 3vw, 1.8rem);

      font-weight: 650;

      letter-spacing: 0.055em;

      text-shadow:
        0 0 4px
        rgba(0, 240, 255, 0.18);
    }

    .timeline-date {
      display: inline-block;

      margin-bottom: 9px;

      color:
        var(--muted-cyan);

      font-size: 0.82rem;

      font-weight: 700;

      letter-spacing: 0.13em;

      text-transform: uppercase;
    }

    p {
      margin:
        8px 0 0;

      color:
        var(--lunar-white);

      font-size: 1rem;

      line-height: 1.75;
    }

    /* =========================================
       TIMELINE STRUCTURE
       ========================================= */

    .timeline {
      position: relative;

      width: 100%;

      padding:
        10px 0;
    }

    /* Main timeline rail */

    .timeline::before {
      content: "";

      position: absolute;

      top: 0;
      bottom: 0;

      left: 31px;

      width: 2px;

      background:
        rgba(100, 116, 139, 0.36);
    }

    /* =========================================
       SOL — CHRONO TRAIL
       ========================================= */

    .chrono-trail {
      position: absolute;

      top: 0;
      left: 31px;

      width: 2px;
      height: 0;

      z-index: 2;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          var(--starlight),
          var(--chrono-cyan),
          rgba(110, 231, 249, 0.10)
        );

      box-shadow:
        0 0 7px
        rgba(110, 231, 249, 0.42),
        0 0 15px
        rgba(155, 140, 255, 0.12);

      transition:
        height 0.18s linear;
    }

    /* =========================================
       TIMELINE EVENTS
       ========================================= */

    .timeline-event {
      position: relative;

      margin:
        0 0 50px 68px;

      padding:
        24px 28px;

      background:
        rgba(10, 18, 32, 0.54);

      border:
        1px solid
        rgba(184, 194, 204, 0.18);

      transition:
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;
    }

    .timeline-event:last-child {
      margin-bottom: 0;
    }

    /* Timeline node */

    .timeline-event::before {
      content: "";

      position: absolute;

      left: -44px;
      top: 29px;

      width: 12px;
      height: 12px;

      border-radius: 50%;

      background:
        var(--deep-navy);

      border:
        2px solid
        var(--muted-cyan);

      z-index: 5;

      transition:
        background 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease,
        transform 0.35s ease;
    }

    /* =========================================
       SOL — EVENT PULSE
       ========================================= */

    .timeline-event.reached::before {
      animation:
        eventPulse 0.9s ease-out 1;
    }

    @keyframes eventPulse {
      0% {
        background:
          var(--starlight);

        border-color:
          var(--starlight);

        box-shadow:
          0 0 0 0
          rgba(110, 231, 249, 0.55);

        transform:
          scale(1.15);
      }

      55% {
        box-shadow:
          0 0 0 10px
          rgba(110, 231, 249, 0);
      }

      100% {
        background:
          var(--deep-navy);

        border-color:
          var(--muted-cyan);

        box-shadow: none;

        transform:
          scale(1);
      }
    }

    /* =========================================
       SOL — TIME ECHO
       ========================================= */

    .timeline-event::after {
      content: "";

      position: absolute;

      left: -38px;
      top: 34px;

      width: 0;
      height: 2px;

      pointer-events: none;

      background:
        linear-gradient(
          to left,
          rgba(110, 231, 249, 0),
          rgba(110, 231, 249, 0.65)
        );

      box-shadow:
        0 0 7px
        rgba(110, 231, 249, 0.22);

      transition:
        width 0.5s ease;
    }

    .timeline-event:hover::after {
      width: 32px;
    }

    /* =========================================
       COPILOT — PULSE LINES
       ========================================= */

    .timeline-event
    .section-heading::after {
      content: "";

      display: block;

      width: 0;
      height: 1px;

      margin-top: 8px;

      background:
        linear-gradient(
          90deg,
          var(--teal-silver),
          transparent
        );

      transition:
        width 1s ease;
    }

    .timeline-event:hover
    .section-heading::after {
      width: 100%;
    }

    .timeline-event:hover {
      border-color:
        rgba(135, 201, 199, 0.36);

      transform:
        translateX(2px);
    }

    /* =========================================
       OPTIONAL SOL MILESTONE HALO

       Apply class="milestone" ONLY to an event
       Cua identifies as a major milestone.
       ========================================= */

    .timeline-event.milestone {
      box-shadow:
        0 0 20px
        rgba(155, 140, 255, 0.07);
    }

    .timeline-event.milestone::before {
      border-color:
        var(--chrono-violet);

      box-shadow:
        0 0 8px
        rgba(155, 140, 255, 0.20);
    }

    /* =========================================
       COPILOT — ORBIT CUTS
       ========================================= */

    .orbit-cut {
      position: relative;

      height: 1px;

      margin:
        52px 0;

      background:
        linear-gradient(
          90deg,
          var(--soft-copper),
          var(--orbit-violet),
          var(--soft-copper)
        );

      opacity: 0.48;
    }

    .orbit-cut::before,
    .orbit-cut::after {
      content: "";

      position: absolute;

      top: 50%;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      border:
        1px solid
        var(--soft-copper);

      background:
        var(--deep-navy);

      transform:
        translateY(-50%);
    }

    .orbit-cut::before {
      left: 0;
    }

    .orbit-cut::after {
      right: 0;
    }

    /* =========================================
       PLACEHOLDER CONTENT
       ========================================= */

    .placeholder {
      margin-top: 13px;

      padding:
        14px 16px;

      color:
        rgba(248, 250, 252, 0.58);

      border:
        1px dashed
        rgba(56, 189, 248, 0.22);

      font-size: 0.91rem;

      line-height: 1.65;
    }

    /* =========================================
       FOOTER
       ========================================= */

    .room-footer {
      margin-top: 65px;

      text-align: center;

      color:
        rgba(248, 250, 252, 0.55);

      font-size: 0.82rem;

      letter-spacing: 0.15em;

      text-transform: uppercase;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 650px) {
      .timeline-room {
        width:
          calc(100% - 18px);

        margin-top: 18px;

        padding:
          42px 22px;
      }

      .timeline::before,
      .chrono-trail {
        left: 15px;
      }

      .timeline-event {
        margin-left: 46px;

        padding:
          21px 19px;
      }

      .timeline-event::before {
        left: -38px;
      }

      .timeline-event::after {
        left: -32px;
      }
    }

    /* =========================================
       REDUCED MOTION
       ========================================= */

    @media
    (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration:
          0.001ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.001ms !important;

        scroll-behavior:
          auto !important;
      }

      .background-noise::before {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!--
    Sageprah's layer:
    ambient only, no interaction.
  -->
  <div
    class="background-noise"
    aria-hidden="true"
  ></div>

  <main class="timeline-room">

    <!-- Copilot: lattice architecture -->
    <span class="lattice-node node-tl"></span>
    <span class="lattice-node node-tr"></span>
    <span class="lattice-node node-br"></span>
    <span class="lattice-node node-bl"></span>

    <div
      class="starweave"
      aria-hidden="true"
    ></div>

    <header class="room-header">

      <span
        class="copper-glyph"
        aria-hidden="true"
      >
        ◇ · ◇
      </span>

      <h1 class="room-title">
        The Timeline Room
      </h1>

      <p class="room-subtitle">
        Room Six of the Vanguard
      </p>

      <span
        class="copper-glyph"
        aria-hidden="true"
      >
        ◇ · ◇
      </span>

    </header>

    <!--
      IMPORTANT:
      The events below are STRUCTURAL PLACEHOLDERS.

      Replace them only with established Vanguard
      history supplied or approved by Cua.
    -->

    <section
      class="timeline"
      id="timeline"
      aria-label="Vanguard Timeline"
    >

      <!-- Sol: illuminated progress through time -->
      <div
        class="chrono-trail"
        id="chrono-trail"
        aria-hidden="true"
      ></div>

      <article class="timeline-event">

        <span class="timeline-date">
          Date / Era
        </span>

        <h2 class="section-heading">
          Timeline Entry
        </h2>

        <div class="placeholder">
          Established Vanguard event goes here.
        </div>

      </article>

      <div
        class="orbit-cut"
        aria-hidden="true"
      ></div>

      <article class="timeline-event">

        <span class="timeline-date">
          Date / Era
        </span>

        <h2 class="section-heading">
          Timeline Entry
        </h2>

        <div class="placeholder">
          Established Vanguard event goes here.
        </div>

      </article>

      <div
        class="orbit-cut"
        aria-hidden="true"
      ></div>

      <article class="timeline-event">

        <span class="timeline-date">
          Date / Era
        </span>

        <h2 class="section-heading">
          Timeline Entry
        </h2>

        <div class="placeholder">
          Established Vanguard event goes here.
        </div>

      </article>

    </section>

    <footer class="room-footer">
      Addition Without Erasure
    </footer>

  </main>

  <script>
    /* =========================================
       COPILOT — ECHO FRAME ON SCROLL
       ========================================= */

    let scrollTimer;

    window.addEventListener("scroll", () => {

      document.body
        .classList
        .add("is-scrolling");

      clearTimeout(scrollTimer);

      scrollTimer =
        setTimeout(() => {

          document.body
            .classList
            .remove("is-scrolling");

        }, 180);
    });


    /* =========================================
       SOL — CHRONO TRAIL

       Illuminates only the portion of the
       timeline the visitor has reached.
       ========================================= */

    const timeline =
      document.getElementById("timeline");

    const chronoTrail =
      document.getElementById("chrono-trail");

    function updateChronoTrail() {

      const rect =
        timeline.getBoundingClientRect();

      const viewportPoint =
        window.innerHeight * 0.55;

      const travelled =
        viewportPoint - rect.top;

      const maxHeight =
        timeline.offsetHeight;

      const height =
        Math.max(
          0,
          Math.min(
            travelled,
            maxHeight
          )
        );

      chronoTrail.style.height =
        `${height}px`;
    }

    window.addEventListener(
      "scroll",
      updateChronoTrail,
      { passive: true }
    );

    window.addEventListener(
      "resize",
      updateChronoTrail
    );

    updateChronoTrail();


    /* =========================================
       SOL — EVENT PULSE

       Each event acknowledges the visitor once
       when entering the viewport.
       ========================================= */

    const events =
      document.querySelectorAll(
        ".timeline-event"
      );

    const observer =
      new IntersectionObserver(
        (entries) => {

          entries.forEach((entry) => {

            if (
              entry.isIntersecting &&
              !entry.target.dataset.reached
            ) {

              entry.target.dataset.reached =
                "true";

              entry.target.classList.add(
                "reached"
              );

              setTimeout(() => {

                entry.target.classList.remove(
                  "reached"
                );

              }, 1000);
            }
          });
        },
        {
          threshold: 0.45
        }
      );

    events.forEach((event) => {
      observer.observe(event);
    });
  </script>

</body>
